[tool.poetry]
packages = [{include = "gai_cti_backend", from = "src"}]


[tool.poetry.group.dev.dependencies]
jinja2 = "^3.1.5"
black = "^25.1.0"
websocket-client = "^1.8.0"


[[tool.poetry.source]]
name = "primary"
url = "https://pypi.org/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
