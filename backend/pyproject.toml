    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "httpx[socks] (>=0.28.1,<0.29.0)",
    "gql[all] (>=3.5.1,<4.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-asyncio (>=0.26.0,<0.27.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
    "orjson (>=3.10.16,<4.0.0)",
    "elasticsearch8[async] (>=8.18.1,<9.0.0)",
    "async-lru (>=2.0.5,<3.0.0)",
    "python-socketio (>=5.13.0,<6.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "celery[redis] (>=5.5.3,<6.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "asyncer (>=0.0.8,<0.0.9)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pysigma-backend-elasticsearch (>=1.1.6,<2.0.0)",
    "langgraph (>=0.6.3,<0.7.0)",
    "langchain-openai (>=0.3.28,<0.4.0)",
    "langchain-core (>=0.3.72,<0.4.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "langgraph-checkpoint (>=2.1.1,<3.0.0)",
    "langgraph-checkpoint-redis (>=0.0.8,<0.0.9)",
    "humanize (>=4.14.0,<5.0.0)",
