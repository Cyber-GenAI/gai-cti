include:
  - ./docker-compose.common.yml
  - ./elastdocker/docker-compose.yml
  - ./opencti/docker-compose.yml

services:
  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        YARN_REGISTRY_DOMAIN: ${GAI_CTI_YARN_REGISTRY_DOMAIN:-registry.yarnpkg.com}
        VITE_API_ROOT: "${GAI_CTI_BASE_URL}/api"
        VITE_KIBANA_API_ROOT: "${GAI_CTI_BASE_URL}/kibana/api"
        VITE_ELASTIC_API_ROOT: "${GAI_CTI_BASE_URL}/elastic"
        VITE_SOCKET_IO_ROOT: "${GAI_CTI_BASE_URL}"

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_MIRROR_HOST: ${GAI_CTI_PIP_MIRROR_HOST:-https://pypi.org}

    environment:
      - USERNAME=${GAI_CTI_USERNAME:-admin}
      - PASSWORD=${GAI_CTI_PASSWORD:-admin}
      - AVALAI_API_KEY=${GAI_CTI_AVALAI_API_KEY}

    depends_on:
      - redis-backend
      - redis-auth
      - opencti
      - elasticsearch
      - kibana

  web-docs:
    build:
      context: ./web-docs
      dockerfile: Dockerfile
      args:
        BASE: "/user-guide"
        SITE_URL: "${GAI_CTI_BASE_URL}"
        VIDEO_BASE_URL: "${GAI_CTI_BASE_URL}/media"

  ollama:
    image: docker.arvancloud.ir/ollama/ollama:0.15.5
    profiles: ["use-gpu"]
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: docker.arvancloud.ir/backplane/open-webui:0.7.2
    profiles: ["use-gpu"]
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'ENABLE_PERSISTENT_CONFIG=False'
      - 'WEBUI_AUTH=True'
      - 'WEBUI_ADMIN_EMAIL=gai-cti@openwebui.com'
      - 'WEBUI_ADMIN_PASSWORD=OpenWebUI#12345678'
    depends_on:
      - ollama

  nginx:
    image: docker.arvancloud.ir/nginx:1.27.4-perl
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./doc-video-files/:/www/media/:ro
    depends_on:
      - back
      - front


volumes:
  ollama_data:
  open_webui_data:
